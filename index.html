        function runClock() {
            var now = new Date();
            var hour = now.getHours();
            var minute = now.getMinutes();
            var seconds = now.getSeconds();
            var hourElapsed = hour % 12 + minute / 60;
            var minuteElapsed = minute + seconds / 60;
            var active = clocks[hour < 12 ? 'am' : 'pm'];
            var inactive = clocks[hour < 12 ? 'pm' : 'am'];
            if (!active.clock.classList.contains('clock--active')) {
                active.clock.classList.add('clock--active');
                inactive.clock.classList.remove('clock--active');
            }
            active.hourHand.setAttribute('transform', 'rotate(' + (hourElapsed * 30) + ' 11 11)');
            active.minuteHand.setAttribute('transform', 'rotate(' + (minuteElapsed * 6) + ' 11 11)');
            var elapsedDegrees = Math.max(0, minuteElapsed * 6 - active.progressAngleOffset);
            var elapsedLength = active.progressCircumference * elapsedDegrees / 360;
            active.progressRing.style.strokeDasharray = '0 ' + elapsedLength + ' ' + (active.progressCircumference - elapsedLength);
        }

        function updateCalendar() {
            var day = (new Date().getDay() + 6) % 7;
            var activeDay = calDays[day];

                for (var i = 0; i < calDays.length; i++) {
                    calDays[i].classList.remove('calendar__day--active');
                    calDays[i].classList.remove('calendar__day--past');
                    if (i < day) calDays[i].classList.add('calendar__day--past');
                }
                activeDay.classList.add('calendar__day--active');
            }

        function configureClockFace(clock) {
            var theme = root.getAttribute('data-theme');
            var hourRadius = theme === 'fruits' ? 9.4 : 7.8;
            var hourOffsetY = theme === 'fruits' ? 0.92 : 0.6;
            var hourGroups = clock.querySelector('.clock__hour-numbers');
            var minuteGroups = clock.querySelector('.clock__minute-numbers');
            var hourNumbers = hourGroups.getElementsByTagName('text');
            var minuteNumbers = minuteGroups.getElementsByTagName('text');
            var i;
            for (i = 0; i < hourNumbers.length; i++) {
                var hourAngle = (i * 30 - 90) * Math.PI / 180;
                hourNumbers[i].setAttribute('x', 11 + hourRadius * Math.cos(hourAngle));
                hourNumbers[i].setAttribute('y', 11 + hourRadius * Math.sin(hourAngle) + hourOffsetY);
            }
            for (i = 0; i < minuteNumbers.length; i++) {
                var minuteAngle = (i * 30 - 90) * Math.PI / 180;
                minuteNumbers[i].setAttribute('x', 11 + 10.2 * Math.cos(minuteAngle));
                minuteNumbers[i].setAttribute('y', 11 + 10.2 * Math.sin(minuteAngle) + 0.35);
            }

            var hourMarks = clock.querySelector('.clock__hour-marks');
            var markRadius = theme === 'fruits' ? 7.6 : 9.1;
            var circumference = 2 * Math.PI * markRadius;
            var markLength = circumference / 12 * (theme === 'fruits' ? 0.005 : 0.04);
            hourMarks.setAttribute('r', markRadius);
            hourMarks.setAttribute('stroke-dasharray', markLength + ' ' + (circumference / 12 - markLength));
            hourMarks.setAttribute('stroke-dashoffset', markLength / 2);

            var innerRing = clock.querySelector('.clock__inner-ring');
            innerRing.setAttribute('r', '9.6');

            var progressRing = clock.querySelector('.clock__progress-ring');
            progressRing.setAttribute('r', '5.5');
            progressRing.setAttribute('stroke-dashoffset', '0');
            progressRing.setAttribute('transform', 'rotate(-90 11 11)');

            var quarterMarks = clock.querySelector('.clock__quarter-marks');
            var quarterRadius = 5.5;
            var quarterCircumference = 2 * Math.PI * quarterRadius;
            var quarterLength = quarterCircumference / 4 * 0.03;
            quarterMarks.setAttribute('r', quarterRadius);
            quarterMarks.setAttribute('fill', 'none');
            quarterMarks.setAttribute('stroke', 'white');
            quarterMarks.setAttribute('stroke-width', '11');
            quarterMarks.setAttribute('stroke-dasharray', quarterLength + ' ' + (quarterCircumference / 4 - quarterLength));
            quarterMarks.setAttribute('stroke-dashoffset', quarterLength / 2);

            var clockState = clocks[clock.id === 'am-clock' ? 'am' : 'pm'];
            var tickMarks = theme === 'fruits' ? quarterMarks : hourMarks;
            var tickDashArray = (tickMarks.getAttribute('stroke-dasharray') || '').split(/[ ,]+/);
            var tickDashLength = parseFloat(tickDashArray[0]);
            var tickRadius = parseFloat(tickMarks.getAttribute('r'));
            var tickHalfAngle = tickDashLength > 0 && tickRadius > 0 ? tickDashLength / tickRadius * 90 / Math.PI : 0;
            var tickStrokeWidth = parseFloat(window.getComputedStyle(tickMarks).strokeWidth);
            var tickStrokeHalfAngle = tickStrokeWidth > 0 && tickRadius > 0 ? Math.atan(tickStrokeWidth / 2 / tickRadius) * 180 / Math.PI : 0;
            var minuteHandLine = clockState.minuteHand.getElementsByTagName('line')[0];
            var handLength = Math.sqrt(Math.pow(parseFloat(minuteHandLine.getAttribute('x2')) - parseFloat(minuteHandLine.getAttribute('x1')), 2) + Math.pow(parseFloat(minuteHandLine.getAttribute('y2')) - parseFloat(minuteHandLine.getAttribute('y1')), 2));
            var handHalfWidth = parseFloat(minuteHandLine.getAttribute('stroke-width')) / 2;
            var handHalfAngle = handLength > 0 ? Math.atan(handHalfWidth / handLength) * 180 / Math.PI : 0;
            clockState.progressCircumference = 2 * Math.PI * 5.5;
            clockState.progressAngleOffset = handHalfAngle + tickHalfAngle + tickStrokeHalfAngle;

            var icons = clock.querySelectorAll('.clock__icon');
            for (i = 0; i < icons.length; i++) {
                var iconClass = icons[i].getAttribute('class') || '';
                var iconHour = parseInt(iconClass.replace(/^.*clock__icon-([0-9]+).*$/, '$1'), 10);
                if (isNaN(iconHour)) continue;
                var iconIndex = iconHour % 12;
                var iconAngle = (iconIndex * 30 - 90) * Math.PI / 180;
                var iconRadius = theme === 'fruits' ? 7 : 6;
                icons[i].setAttribute('transform', 'translate(' + (11 + iconRadius * Math.cos(iconAngle) - 1) + ' ' + (iconRadius * Math.sin(iconAngle)) + ')');
            }
        }

        function getFormattedTitle(name) {

        function updateClockIcons(icons) {
            if (!icons) return;
            for (var icon in icons) {
                if (!icons.hasOwnProperty(icon) || !icons[icon]) continue;
                for (var i = 0; i < icons[icon].length; i++) {
                    var hour = icons[icon][i];
                    var iconNode = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    iconNode.setAttribute('class', 'clock__icon clock__icon-' + hour);
                    var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');

                }
            }
        }
        function setClockFeatures(data) {

        function applyProfile() {

        function updateSleepMode() {

            var hour = new Date().getHours();
            var isNight = hour >= profile.sleepTimeSec / 3600 || hour < profile.wakeUpTimeSec / 3600;
            if (isNight) root.classList.add('sleep');
            else root.classList.remove('sleep');

        function updateWeather(data) {
            var forecast = data.todayForecastData;
            var current = data.currentWeatherData;
            if (!forecast || !current || !current[0]) return;
            var today = forecast.DailyForecasts[0];
            var precipitation = today.Day.PrecipitationType;
            var display = precipitation === 'Rain' || precipitation === 'Snow' ? 'inline' : 'none';
            var html = '<div class="weather__temp"><span class="weather__current-temp">' + current[0].RealFeelTemperature.Metric.Value + '°</span> ▸ <span class="weather__max-temp">' + today.Temperature.Maximum.Value + '°</span>' +
                '<svg viewBox="0 0 960 960" class="weather__percipitation-icon" style="display: ' + display + '"><use href="#' + precipitation + '"></svg></div>' +
                '<svg viewBox="0 0 300 300" class="weather__forecast-icon"><use xlink:href="#w-' + today.Day.Icon + '" width="250" height="250" x="25" y="25"></use></svg>';
            var container = document.getElementById('weather');
            container.innerHTML = html;
            container.style.display = 'block';
        }
        function updateCalendarImages(data) {
            if (!data || !data.records) return;
            var urlsPerDay = [];
            for (var i = 0; i < data.records.length; i++) {
                var urls = [];
                var fields = data.records[i].fields || {};
                for (var fieldName in fields) {
                    if (!fields.hasOwnProperty(fieldName)) continue;
                    var attachments = fields[fieldName];
                    if (!Array.isArray(attachments)) continue;
                    for (var j = 0; j < attachments.length; j++) {
                        var attachment = attachments[j];
                        if (attachment && attachment.thumbnails && attachment.thumbnails.large && attachment.thumbnails.large.url) urls.push(attachment.thumbnails.large.url);
                    }
                }
                urlsPerDay.push(urls);
            }
            for (var dayIndex = 0; dayIndex < calDays.length; dayIndex++) {
                var oldEvents = calDays[dayIndex].getElementsByClassName('calendar__event');
                while (oldEvents.length) oldEvents[0].parentNode.removeChild(oldEvents[0]);
                var dayUrls = urlsPerDay[dayIndex] || [];
                for (var urlIndex = 0; urlIndex < dayUrls.length; urlIndex++) {
                    (function(day, url) {
                        var image = new Image();
                        image.onload = function() {
                            var eventNode = document.createElement('div');
                            eventNode.className = 'calendar__event';
                            eventNode.style.backgroundImage = 'url(' + url + ')';
                            day.appendChild(eventNode);

                        image.src = url;

                }
            }

        }
        requestJSON('/.netlify/functions/weather', updateWeather, function(error) { console.error('Error:', error); });
        requestJSON('/.netlify/functions/calendar?id=' + encodeURIComponent(userId || ''), updateCalendarImages, function(error) { console.error('Error:', error); });
        setInterval(refreshData, 30 * 60 * 1000);
    </script>
