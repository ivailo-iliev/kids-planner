<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Kids Planner</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
        }

        #planner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #close {
            position: fixed;
            z-index: 10;
            top: 8px;
            right: 8px;
            width: 48px;
            height: 48px;
            padding: 0;
            border: 2px solid #777;
            border-radius: 50%;
            background: #fff;
            color: #333;
            font: bold 32px/42px Arial, sans-serif;
            text-align: center;
            -webkit-appearance: none;
            appearance: none;
        }

        #version {
            position: fixed;
            z-index: 10;
            top: 8px;
            left: 8px;
            padding: 4px 6px;
            background: #fff;
            color: #555;
            font: 14px/1.2 Arial, sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="version">Kids Planner v1.0.9</div>
    <button id="close" type="button" aria-label="Close Kids Planner" title="Close">&times;</button>
    <script>
        function loadPlanner() {
            var iframe = document.createElement('iframe');
            iframe.id = 'planner';
            iframe.title = 'Kids Planner morning routine';
            iframe.src = 'https://kids-planner.netlify.app/test.html';
            document.body.insertBefore(iframe, document.body.firstChild);
        }

        (function startKidsPlanner() {
            var kindle = window.kindle;

            if (kindle && kindle.dev && typeof kindle.dev.setOrientation === 'function') {
                try {
                    kindle.dev.setOrientation('landscape');
                } catch (error) {}
            }

            if (kindle && kindle.messaging && typeof kindle.messaging.sendStringMessage === 'function') {
                try {
                    kindle.messaging.sendStringMessage(
                        'com.lab126.mfa',
                        'switchViewMode',
                        'fullscreen'
                    );
                } catch (error) {}
            }

            setTimeout(loadPlanner, 500);
        }());

        document.getElementById('close').onclick = function() {
            if (window.kindle && window.kindle.dev && window.kindle.dev.setOrientation) {
                window.kindle.dev.setOrientation('auto');
            }
            if (window.kindle && window.kindle.appmgr && window.kindle.appmgr.start) {
                window.kindle.appmgr.start('com.lab126.booklet.home');
            }
        };
    </script>
</body>
</html>
