<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Planner</title>
<style>
html, body { width: 100%; height: 100%; margin: 0; }
body { color: #111; background: #fff; font-family: Arial, sans-serif; }
table { width: 100%; height: 100%; table-layout: fixed; border-collapse: collapse; }
tr { height: 50%; }
td { padding: 0; text-align: left; vertical-align: middle; white-space: nowrap; line-height: 1; }
.person-icon, .emoji-item { display: inline-block; width: 1em; text-align: center; vertical-align: middle; }
.person-icon { margin-right: 0.35em; }
.emoji-item { margin-right: 0.18em; }
.emoji-item.done .task-icon { display: none; }
.emoji-item.done:after { content: "✅"; }
@font-face {
  font-family: "Noto Emoji";
  src: url("https://raw.githubusercontent.com/ghostlypi/NotoSans/main/NotoEmoji-Regular.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}
html.kindle-emoji .emoji { font-family: "Noto Emoji", sans-serif; }
</style>
<script>
function toggleDone(el) {
  var name = "done";
  var classes = " " + el.className + " ";

  if (classes.indexOf(" " + name + " ") !== -1) {
    el.className = classes
      .replace(" " + name + " ", " ")
      .replace(/^\s+|\s+$/g, "");
  } else {
    el.className += (el.className ? " " : "") + name;
  }

  return false;
}

function isLegacyKindleUserAgent(userAgent) {
  return /Linux armv7l/i.test(userAgent) &&
    /AppleWebKit\/534\.26\+/i.test(userAgent) &&
    /Version\/5\.0 Safari\/534\.26\+/i.test(userAgent);
}

if (isLegacyKindleUserAgent(navigator.userAgent || "")) {
  document.documentElement.className +=
    (document.documentElement.className ? " " : "") + "kindle-emoji";
}
</script>
</head>
<body>
<table width="100%" height="100%" cellspacing="0" cellpadding="0">
  <tr aria-label="Girl routine">
    <td>
      <span class="person-icon emoji">👧</span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">🪥</span></span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">🪮</span></span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">👗</span></span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">🍳</span></span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">👟</span></span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">🎒</span></span>
    </td>
  </tr>
  <tr aria-label="Boy routine">
    <td>
      <span class="person-icon emoji">👦</span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">🪥</span></span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">👕</span></span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">🍳</span></span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">👟</span></span>
      <span class="emoji-item emoji" onclick="return toggleDone(this)"><span class="task-icon">🎒</span></span>
    </td>
  </tr>
</table>
<script>
function resizeRoutineEmoji() {
  var table = document.getElementsByTagName("table")[0];
  var rows = table.getElementsByTagName("tr");
  var allItems = [];
  var maxItems = 0;
  var maxWidthUnits = 0;
  var availableWidth = 0;
  var availableHeight = 0;
  var i;

  for (i = 0; i < rows.length; i++) {
    var cell = rows[i].getElementsByTagName("td")[0];
    var spans = cell.getElementsByTagName("span");
    var rowItems = 0;
    var rowWidthUnits = 0;
    var j;

    for (j = 0; j < spans.length; j++) {
      var className = spans[j].className;
      if (/(^|\s)(person-icon|emoji-item)(\s|$)/.test(className)) {
        allItems.push(spans[j]);
        rowItems++;
        rowWidthUnits += 1;
        rowWidthUnits += /(^|\s)person-icon(\s|$)/.test(className) ? 0.35 : 0.18;
      }
    }

    if (rowItems > maxItems) {
      maxItems = rowItems;
    }
    if (rowWidthUnits > maxWidthUnits) {
      maxWidthUnits = rowWidthUnits;
    }

    if (i === 0 || cell.clientWidth < availableWidth) {
      availableWidth = cell.clientWidth;
    }
    if (i === 0 || cell.clientHeight < availableHeight) {
      availableHeight = cell.clientHeight;
    }
  }

  if (!maxItems || !maxWidthUnits || !availableWidth || !availableHeight) {
    return;
  }

  var iconSize = Math.floor(Math.min(availableWidth / maxWidthUnits, availableHeight * 0.8));
  for (i = 0; i < allItems.length; i++) {
    allItems[i].style.fontSize = iconSize + "px";
  }
}

window.onresize = resizeRoutineEmoji;
window.onorientationchange = resizeRoutineEmoji;
resizeRoutineEmoji();
</script>
</body>
</html>
