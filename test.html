<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kindle Emoji Font Test</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Emoji:wght@300..700&display=swap" rel="stylesheet">

<style>
@font-face {
  font-family: "Noto Emoji Embedded";
  src: url("https://raw.githubusercontent.com/ghostlypi/NotoSans/main/NotoEmoji-Regular.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}

body {
  font-size: 20px;
}

p {
  margin: 1em 0;
}

.emoji {
  font-size: 42px;
  line-height: 1.35;
}
</style>
</head>
<body>

<p style="font-family: 'Noto Emoji Embedded', sans-serif;">
  Embedded Noto Emoji (TTF via @font-face)<br>
  <span class="emoji">👧 👦 🪥 🪮 👗 👕 🍞 👟 🎒 🍽️ 🛁 📖 🛏️ ☀️ 🌙 ✅</span>
</p>

<p style="font-family: 'Noto Emoji', sans-serif;">
  Google Fonts — Noto Emoji<br>
  <span class="emoji">👧 👦 🪥 🪮 👗 👕 🍞 👟 🎒 🍽️ 🛁 📖 🛏️ ☀️ 🌙 ✅</span>
</p>

<p style="font-family: 'Noto Color Emoji', sans-serif;">
  Google Fonts — Noto Color Emoji<br>
  <span class="emoji">👧 👦 🪥 🪮 👗 👕 🍞 👟 🎒 🍽️ 🛁 📖 🛏️ ☀️ 🌙 ✅</span>
</p>

</body>
</html>
