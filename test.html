<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kindle Emoji Fallback Test</title>

<style>
@font-face {
  font-family: "Noto Emoji Kindle";
  src: url("https://raw.githubusercontent.com/ghostlypi/NotoSans/main/NotoEmoji-Regular.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}

body {
  font-size: 20px;
}

p {
  margin: 1em 0;
}

.emoji {
  font-size: 42px;
  line-height: 1.35;
}

/* Only Kindle gets the bundled monochrome emoji font. */
html.kindle .emoji-auto {
  font-family: "Noto Emoji Kindle", sans-serif;
}
</style>

<script>
(function () {
  var ua = navigator.userAgent || "";
  if (/Kindle|Silk|KFAPWI|KFTT|KFSOWI/i.test(ua)) {
    document.documentElement.className +=
      (document.documentElement.className ? " " : "") + "kindle";
  }
}());
</script>
</head>
<body>

<p>
  Native/default rendering (control)<br>
  <span class="emoji">👧 👦 🪥 🪮 👗 👕 🍞 👟 🎒 🍽️ 🛁 📖 🛏️ ☀️ 🌙 ✅</span>
</p>

<p>
  Automatic final strategy
  <span id="mode"></span><br>
  <span class="emoji emoji-auto">👧 👦 🪥 🪮 👗 👕 🍞 👟 🎒 🍽️ 🛁 📖 🛏️ ☀️ 🌙 ✅</span>
</p>

<script>
(function () {
  var isKindle = /(^|\s)kindle(\s|$)/.test(document.documentElement.className);
  document.getElementById("mode").innerHTML =
    isKindle ? " — Kindle: embedded Noto Emoji TTF" : " — modern browser: OS native emoji";
}());
</script>

</body>
</html>
