<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Planner</title>
<style>
html, body { width: 100%; height: 100%; margin: 0; }
body { color: #1f2933; background: #edf1f4; font-family: Arial, sans-serif; }
#planner { width: 100%; height: 100%; table-layout: fixed; border-collapse: collapse; }
#planner tr { height: 50%; }
#planner td { padding: 6px 8px; vertical-align: middle; }
.routine-card { height: 100%; padding: 8px 12px; box-sizing: border-box; border: 1px solid #cbd5dc; border-radius: 14px; background: #fff; }
.routine-heading { height: 20%; box-sizing: border-box; padding: 4px 2px; color: #263746; font-size: 19px; font-weight: bold; white-space: nowrap; }
.person-icon { display: inline-block; margin-right: 8px; line-height: 1; vertical-align: middle; }
.routine-name { vertical-align: middle; }
.task-list { height: 78%; font-size: 0; line-height: 1; text-align: left; white-space: nowrap; }
.emoji-item { position: relative; display: inline-block; width: 13.9%; height: 96%; margin: 0 0.05%; padding: 6px 4px; box-sizing: border-box; vertical-align: top; border: 1px solid #d6dee5; border-radius: 12px; background: #f7f9fa; color: #1f2933; text-align: center; white-space: normal; }
.task-icon { display: block; margin: 12px auto 8px; line-height: 1; }
.task-label { display: block; font-size: 14px; font-weight: bold; line-height: 1.2; }
.emoji-item.done { border-color: #78a98a; background: #e7f2ea; }
.emoji-item.done .task-icon { display: none; }
.emoji-item.done:after { content: "✓"; position: absolute; top: 5px; right: 8px; color: #176b3a; font: bold 20px/1 Arial, sans-serif; }
@font-face {
  font-family: "Noto Emoji";
  src: url("https://raw.githubusercontent.com/ghostlypi/NotoSans/main/NotoEmoji-Regular.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}
html.kindle-emoji .emoji { font-family: "Noto Emoji", sans-serif; }
html.portrait #planner td { padding: 5px 8px; }
html.portrait .routine-card { padding: 8px 10px; }
html.portrait .routine-heading { height: 18%; font-size: 18px; }
html.portrait .task-list { height: 80%; white-space: normal; }
html.portrait .emoji-item { width: 31.5%; height: 44%; margin: 0.5%; padding: 6px 4px; }
</style>
<script>
function toggleDone(el) {
  var name = "done";
  var classes = " " + el.className + " ";

  if (classes.indexOf(" " + name + " ") !== -1) {
    el.className = classes
      .replace(" " + name + " ", " ")
      .replace(/^\s+|\s+$/g, "");
  } else {
    el.className += (el.className ? " " : "") + name;
  }

  return false;
}

function isLegacyKindleUserAgent(userAgent) {
  return /Linux armv7l/i.test(userAgent) &&
    /AppleWebKit\/534\.26\+/i.test(userAgent) &&
    /Version\/5\.0 Safari\/534\.26\+/i.test(userAgent);
}

if (isLegacyKindleUserAgent(navigator.userAgent || "")) {
  document.documentElement.className +=
    (document.documentElement.className ? " " : "") + "kindle-emoji";
}
</script>
</head>
<body>
<table id="planner" role="presentation">
  <tr>
    <td>
      <div class="routine-card" role="group" aria-label="Елена">
        <div class="routine-heading"><span class="person-icon emoji">👧</span><span class="routine-name">Елена</span></div>
        <div class="task-list">
          <span class="emoji-item" onclick="return toggleDone(this)" title="Brush teeth" aria-label="Brush teeth"><span class="task-icon emoji">🪥</span><span class="task-label">Brush teeth</span></span>
          <span class="emoji-item" onclick="return toggleDone(this)" title="Brush hair" aria-label="Brush hair"><span class="task-icon emoji">🪮</span><span class="task-label">Brush hair</span></span>
          <span class="emoji-item" onclick="return toggleDone(this)" title="Get dressed" aria-label="Get dressed"><span class="task-icon emoji">👗</span><span class="task-label">Get dressed</span></span>
          <span class="emoji-item" onclick="return toggleDone(this)" title="Eat breakfast" aria-label="Eat breakfast"><span class="task-icon emoji">🍳</span><span class="task-label">Eat breakfast</span></span>
          <span class="emoji-item" onclick="return toggleDone(this)" title="Put on shoes" aria-label="Put on shoes"><span class="task-icon emoji">👟</span><span class="task-label">Put on shoes</span></span>
          <span class="emoji-item" onclick="return toggleDone(this)" title="Pack bag" aria-label="Pack bag"><span class="task-icon emoji">🎒</span><span class="task-label">Pack bag</span></span>
        </div>
      </div>
    </td>
  </tr>
  <tr>
    <td>
      <div class="routine-card" role="group" aria-label="Филип">
        <div class="routine-heading"><span class="person-icon emoji">👦</span><span class="routine-name">Филип</span></div>
        <div class="task-list">
          <span class="emoji-item" onclick="return toggleDone(this)" title="Brush teeth" aria-label="Brush teeth"><span class="task-icon emoji">🪥</span><span class="task-label">Brush teeth</span></span>
          <span class="emoji-item" onclick="return toggleDone(this)" title="Get dressed" aria-label="Get dressed"><span class="task-icon emoji">👕</span><span class="task-label">Get dressed</span></span>
          <span class="emoji-item" onclick="return toggleDone(this)" title="Eat breakfast" aria-label="Eat breakfast"><span class="task-icon emoji">🍳</span><span class="task-label">Eat breakfast</span></span>
          <span class="emoji-item" onclick="return toggleDone(this)" title="Put on shoes" aria-label="Put on shoes"><span class="task-icon emoji">👟</span><span class="task-label">Put on shoes</span></span>
          <span class="emoji-item" onclick="return toggleDone(this)" title="Pack bag" aria-label="Pack bag"><span class="task-icon emoji">🎒</span><span class="task-label">Pack bag</span></span>
        </div>
      </div>
    </td>
  </tr>
</table>
<script>
function updateOrientationLayout() {
  var html = document.documentElement;
  var classes = " " + html.className + " ";
  var spans;
  var viewportWidth = window.innerWidth || html.clientWidth;
  var viewportHeight = window.innerHeight || html.clientHeight;
  var i;

  classes = classes.replace(/ portrait /g, " ");
  if (viewportHeight >= viewportWidth) {
    classes += " portrait ";
  }
  html.className = classes.replace(/^\s+|\s+$/g, "");

  spans = document.getElementsByTagName("span");
  for (i = 0; i < spans.length; i++) {
    var className = spans[i].className;
    var holder = spans[i].parentNode;
    var iconSize;

    if (/(^|\s)task-icon(\s|$)/.test(className)) {
      iconSize = Math.floor(Math.min(holder.clientWidth * 0.48, holder.clientHeight * 0.42));
    } else if (/(^|\s)person-icon(\s|$)/.test(className)) {
      iconSize = Math.floor(Math.min(holder.clientWidth * 0.15, holder.clientHeight * 0.7));
    } else {
      continue;
    }

    if (iconSize > 0) {
      spans[i].style.fontSize = iconSize + "px";
    }
  }
}

window.onresize = updateOrientationLayout;
window.onorientationchange = updateOrientationLayout;
updateOrientationLayout();
</script>
</body>
</html>
